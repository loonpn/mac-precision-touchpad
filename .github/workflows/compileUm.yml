name: Build UMDF Driver for 14393

on: [push]

jobs:
  build:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4

    - name: Install Visual C++ 2015 Build Tools
      run: |
        curl -L -o vs_buildtools.exe https://download.microsoft.com/download/5/f/7/5f7acaeb-8363-451f-9425-68a90f98b238/visualcppbuildtools_full.exe
        .\vs_buildtools.exe /quiet /norestart

    - name: Install SDK 14393
      run: |
        curl -L -o sdk_14393.exe https://go.microsoft.com/fwlink/p/?LinkId=838916
        .\sdk_14393.exe /quiet /norestart

    - name: Install WDK 14393
      run: |
        curl -L -o wdk_14393.exe https://go.microsoft.com/fwlink/p/?LinkId=526733
        .\wdk_14393.exe /quiet /norestart

    - name: Verify Environment
      run: |
        if (Test-Path "C:\Program Files (x86)\Microsoft Visual Studio 14.0\VC\bin\cl.exe") {
          Write-Host "✅ VS2015 found"
        } else {
          Write-Error "❌ VS2015 not found"
          exit 1
        }
        if (Test-Path "C:\Program Files (x86)\Windows Kits\10\Include\10.0.14393.0") {
          Write-Host "✅ WDK found"
        } else {
          Write-Error "❌ WDK not found"
          exit 1
        }

    - name: Build Driver (x64 ReleaseSigned)
      run: |
        msbuild src\AmtPtpDeviceUsbUm\MagicTrackpad2PtpDevice.vcxproj /p:Configuration=ReleaseSigned /p:Platform=x64 /p:WindowsTargetPlatformVersion=10.0.14393.0
