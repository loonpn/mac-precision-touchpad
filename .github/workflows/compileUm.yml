name: Build UMDF Driver WDK 14393

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build Driver
    runs-on: windows-2022

    steps:

    - name: Checkout source
      uses: actions/checkout@v4


    ############################################################
    # Show runner environment
    ############################################################
    - name: Show Build Environment
      shell: powershell
      run: |
        Write-Host "========== OS =========="
        systeminfo | findstr /B /C:"OS Name" /C:"OS Version"

        Write-Host ""
        Write-Host "========== PowerShell =========="
        $PSVersionTable

        Write-Host ""
        Write-Host "========== Existing Visual Studio =========="
        Get-ChildItem `
          "C:\Program Files\Microsoft Visual Studio\2022" `
          -ErrorAction SilentlyContinue


    ############################################################
    # Install old WDK 14393
    ############################################################
    - name: Install WDK 14393
      shell: powershell
      run: |

        Write-Host "Downloading WDK 14393..."

        curl.exe `
          -L `
          -o wdk_14393.exe `
          https://go.microsoft.com/fwlink/p/?LinkId=526733


        Write-Host "WDK installer size:"
        Get-Item .\wdk_14393.exe |
          Select-Object Name,Length


        Write-Host "Installing WDK..."

        Start-Process `
          .\wdk_14393.exe `
          -ArgumentList "/quiet","/norestart" `
          -Wait `
          -PassThru


        Write-Host "WDK installer finished"


    ############################################################
    # Verify SDK / WDK
    ############################################################
    - name: Verify WDK Installation
      shell: powershell
      run: |

        Write-Host "========== Windows Kits =========="

        Get-ChildItem `
          "C:\Program Files (x86)\Windows Kits\10\Include"


        Write-Host ""
        Write-Host "Checking 14393 SDK..."

        if (Test-Path `
          "C:\Program Files (x86)\Windows Kits\10\Include\10.0.14393.0") {

            Write-Host "OK: SDK 14393 found"

        } else {

            Write-Error "FAILED: SDK 14393 missing"
            exit 1
        }


        Write-Host ""
        Write-Host "========== WDK tools =========="

        Get-ChildItem `
          "C:\Program Files (x86)\Windows Kits\10\bin\10.0.14393.0" `
          -ErrorAction SilentlyContinue


    ############################################################
    # Verify MSBuild
    ############################################################
    - name: Verify Visual Studio Build Tools
      shell: powershell
      run: |
    
        Write-Host "========== Locate Visual Studio =========="
    
        $vswhere = `
          "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
    
    
        if (!(Test-Path $vswhere)) {
    
            Write-Error "vswhere.exe not found"
            exit 1
    
        }
    
    
        $msbuild = & $vswhere `
          -latest `
          -products * `
          -requires Microsoft.Component.MSBuild `
          -find MSBuild\**\Bin\MSBuild.exe
    
    
        Write-Host ""
        Write-Host "MSBuild path:"
        Write-Host $msbuild
    
    
        if ([string]::IsNullOrWhiteSpace($msbuild)) {
    
            Write-Error "MSBuild not found"
            exit 1
    
        }
    
    
        if (!(Test-Path $msbuild)) {
    
            Write-Error "MSBuild path invalid"
            exit 1
    
        }
    
    
        Write-Host ""
        Write-Host "========== MSBuild Version =========="
    
        & "$msbuild" -version



    ############################################################
    # Build
    ############################################################
    - name: Build Driver x64 ReleaseSigned
      shell: powershell
      run: |
    
        $vswhere = `
          "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
    
    
        $msbuild = & $vswhere `
          -latest `
          -products * `
          -requires Microsoft.Component.MSBuild `
          -find MSBuild\**\Bin\MSBuild.exe
    
    
        Write-Host "Using MSBuild:"
        Write-Host $msbuild
    
    
        & "$msbuild" `
          src\AmtPtpDeviceUsbUm\MagicTrackpad2PtpDevice.vcxproj `
          /m `
          /v:detailed `
          /p:Configuration=ReleaseSigned `
          /p:Platform=x64 `
          /p:WindowsTargetPlatformVersion=10.0.14393.0

    ############################################################
    # Collect artifacts
    ############################################################
    - name: List Build Output
      if: always()
      shell: powershell
      run: |

        Write-Host "Searching output files..."

        Get-ChildItem `
          -Path . `
          -Include *.sys,*.cat,*.inf `
          -Recurse `
          -ErrorAction SilentlyContinue
